<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHSAN x NOVA CORE AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 20% 20%, #1a1f3a 0%, #0a0e1a 50%, #05070d 100%);
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(88, 101, 242, 0.08) 0%, transparent 60%);
    animation: rotate 20s linear infinite;
    z-index: -1;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .header {
    text-align: center;
    margin-bottom: 25px;
    animation: fadeDown 0.8s ease;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(90deg, #5865f2, #a855f7, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header p {
    color: #8b949e;
    font-size: 0.85rem;
    margin-top: 6px;
    letter-spacing: 0.5px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 0.75rem;
    color: #3fb950;
    background: rgba(63, 185, 80, 0.1);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(63, 185, 80, 0.2);
  }
  .status::before {
    content: '';
    width: 7px; height: 7px;
    background: #3fb950;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .chat-container {
    width: 100%;
    max-width: 780px;
    height: 65vh;
    background: rgba(22, 27, 34, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(88, 101, 242, 0.15);
    border-radius: 20px;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: fadeUp 0.8s ease;
  }
  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-thumb {
    background: rgba(88, 101, 242, 0.4);
    border-radius: 10px;
  }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.5;
    animation: msgIn 0.3s ease;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .user {
    align-self: flex-end;
    background: linear-gradient(135deg, #5865f2, #7c3aed);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
  }
  .bot {
    align-self: flex-start;
    background: rgba(33, 38, 45, 0.9);
    border: 1px solid rgba(255,255,255,0.06);
    color: #c9d1d9;
    border-bottom-left-radius: 4px;
  }
  .bot .label {
    display: block;
    font-size: 0.7rem;
    color: #a855f7;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .typing { display: inline-flex; gap: 4px; }
  .typing span {
    width: 7px; height: 7px;
    background: #8b949e;
    border-radius: 50%;
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .welcome {
    text-align: center;
    margin: auto;
    color: #8b949e;
  }
  .welcome .icon {
    font-size: 3rem;
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .welcome h2 { color: #e6edf3; font-size: 1.2rem; margin-bottom: 6px; }
  .welcome p { font-size: 0.85rem; }

  .input-area {
    width: 100%;
    max-width: 780px;
    margin-top: 16px;
    display: flex;
    gap: 10px;
    background: rgba(22, 27, 34, 0.8);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(88, 101, 242, 0.2);
    border-radius: 16px;
    padding: 8px;
    animation: fadeUp 1s ease;
    transition: border-color 0.3s;
  }
  .input-area:focus-within {
    border-color: rgba(88, 101, 242, 0.6);
    box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.1);
  }
  .input-area input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e6edf3;
    font-size: 0.95rem;
    padding: 10px 14px;
    font-family: inherit;
  }
  .input-area input::placeholder { color: #6e7681; }
  .input-area button {
    background: linear-gradient(135deg, #5865f2, #a855f7);
    border: none;
    color: #fff;
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .input-area button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
  }
  .input-area button:active { transform: scale(0.95); }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  .input-area button svg { width: 20px; height: 20px; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    .header h1 { font-size: 1.5rem; }
    .chat-container { height: 60vh; padding: 14px; border-radius: 16px; }
    .msg { max-width: 90%; font-size: 0.88rem; }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>⚡ AHSAN × NOVA CORE AI</h1>
    <p>POWERED BY NOVA CORE ENGINE</p>
    <div class="status">Online · Fast Response</div>
  </div>

  <div class="chat-container" id="chat">
    <div class="welcome" id="welcome">
      <div class="icon">🤖</div>
      <h2>Kya madad chahiye?</h2>
      <p>Apna sawal likhein aur AI ka jawab paayein</p>
    </div>
  </div>

  <div class="input-area">
    <input id="q" placeholder="Message AHSAN x NOVA CORE AI..." autocomplete="off" />
    <button id="sendBtn" onclick="send()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

<script>
  // ✅ WORKING API
  const API = "https://gpt-3-5.apis-bj-devs.workers.dev/?prompt=";

  const chat = document.getElementById("chat");
  const input = document.getElementById("q");
  const btn = document.getElementById("sendBtn");
  let busy = false;

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
  });

  async function send() {
    const q = input.value.trim();
    if (!q || busy) return;

    document.getElementById("welcome")?.remove();
    busy = true;
    btn.disabled = true;

    // User message
    const userMsg = document.createElement("div");
    userMsg.className = "msg user";
    userMsg.textContent = q;
    chat.appendChild(userMsg);

    input.value = "";
    scrollBottom();

    // Typing indicator
    const typingMsg = document.createElement("div");
    typingMsg.className = "msg bot";
    typingMsg.innerHTML = `<span class="label">NOVA CORE</span><span class="typing"><span></span><span></span><span></span></span>`;
    chat.appendChild(typingMsg);
    scrollBottom();

    try {
      const res = await fetch(API + encodeURIComponent(q));
      const data = await res.json();

      if (data.status === true && data.reply) {
        typingMsg.innerHTML = `<span class="label">NOVA CORE</span>`;
        typingMsg.appendChild(document.createTextNode(data.reply));
      } else {
        typingMsg.innerHTML = `<span class="label">NOVA CORE</span>`;
        typingMsg.appendChild(document.createTextNode("⚠️ " + (data.reply || "Koi jawab nahi mila")));
      }
    } catch (err) {
      typingMsg.innerHTML = `<span class="label">NOVA CORE</span>`;
      typingMsg.appendChild(document.createTextNode("⚠️ Network error: " + err.message));
    }

    busy = false;
    btn.disabled = false;
    scrollBottom();
    input.focus();
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
